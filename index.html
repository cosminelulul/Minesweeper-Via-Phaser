<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper Clone</title>
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.55.2/phaser.min.js"></script>

  <!-- app.js must stay first: it holds the shared constants and starts the game -->
  <script src="app.js"></script>
  <script src="menu.js"></script>
  <script src="game.js"></script>
<style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #101010;
    }

    /* The game canvas lives in here and scales to fit the window */
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game"></div>
</body>
</html>
